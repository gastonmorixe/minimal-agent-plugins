name: CI

# Full gate on pull requests and pushes to main.
# bun.lock is gitignored in this repo (local regenerations), so installs are
# not --frozen-lockfile; the catalog in package.json still pins the toolchain.
on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: bun run check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Install dependencies
        run: bun install

      - name: Run check
        run: bun run check
